[project]
name = "async-grpo-lora-hf-repro"
version = "0.1.0"
description = "Multi-Server Async GRPO with LoRA reproduction across two Google Colab VMs"
readme = "README.md"
authors = [
    { name = "carlesoctav", email = "carlesoctavianus@tuta.io" }
]
requires-python = ">=3.12"
dependencies = [
    "torchy-core",
    "kernels==0.17.2",
    "math-verify>=0.9.0",
    "sws-config>=0.10.0",
    "trackio>=0.39.0",
    "trl[vllm]>=0.24.0",
    "vllm",
    "peft>=0.21.2",
]

[tool.uv]
override-dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers>=5.10.4",
    "trl==1.14.1",
    "vllm==0.30.0",
    "datasets==5.0.1",
]

[tool.uv.sources]
torchy-core = { path = "../common", editable = true }
trl = { git = "https://github.com/carlesoctav/trl" }

[tool.hatch.build.targets.wheel]
packages = ["env"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
