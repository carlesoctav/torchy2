[project]
name = "wordle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "carlesoctav", email = "carlesoctavianus@tuta.io" }
]
requires-python = ">=3.12"
dependencies = [
    "torchy-core",
    "kernels==0.17.2",
    "math-verify>=0.9.0",
    "sws-config>=0.10.0",
    "trackio>=0.39.0",
    "trl[vllm]>=1.16.0",
    "vllm",
    "peft>=0.21.2",
    "openenv>=0.4.1",
    "openenv-textarena",
]

[tool.uv]
override-dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers>=5.10.4",
    "trl==1.16.0",
    "vllm==0.30.0",
    "datasets==5.0.1",
]
package = false


[project.scripts]
wordle = "wordle:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torchy-core = { path = "../common", editable = true }
openenv-textarena = { git = "https://huggingface.co/spaces/openenv/wordle" }

