[project]
name = "torchy-core"
version = "0.1.0"
description = "Shared infrastructure, config loader, patches, proxy, and callbacks for torchy2 experiments"
authors = [
    { name = "carlesoctav", email = "carlesoctavianus@tuta.io" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "sws-config>=0.10.0",
    "torchao>=0.18.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
